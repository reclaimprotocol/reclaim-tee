[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
# 256M produced an out-of-spec FAT32 (<65525 clusters) that OVMF could not
# read, causing "Failed to load image / Not Found" -> boot loop. 512M gives a
# valid FAT32 cluster count and comfortably holds the ~74M UKI.
SizeMinBytes=512M
SizeMaxBytes=512M
