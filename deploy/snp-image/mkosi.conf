[Distribution]
Distribution=ubuntu
Release=noble
# systemd-boot-efi (the sd-stub for the UKI) lives in universe on Ubuntu.
Repositories=main,universe

[Output]
Format=disk
Output=snp-verity
# Fixed seed => deterministic partition AND filesystem UUIDs (systemd-repart
# derives them from this), so the dm-verity roothash is reproducible.
Seed=b5f8a3c2-1d4e-4a6b-9c8d-7e0f1a2b3c4d

[Content]
Bootable=yes
Bootloader=uki
# Clamp all file mtimes to a fixed epoch so the rootfs (and its verity hash)
# is byte-identical across rebuilds. In production this is the source commit
# epoch, matching how the container TEE images are pinned.
SourceDateEpoch=1735689600
# linux-image-gcp: GCP-tuned kernel (virtio, dm-verity, erofs, tpm, sev-guest).
# systemd-boot-efi: provides linuxx64.efi.stub used to build the measured UKI.
Packages=
        systemd
        systemd-boot-efi
        udev
        dbus
        linux-image-gcp
# mkosi appends roothash=<verity root hash> automatically; console=ttyS0 sends
# everything to the GCP serial port.
KernelCommandLine=console=ttyS0,115200 systemd.journald.forward_to_console=1 systemd.log_target=console
