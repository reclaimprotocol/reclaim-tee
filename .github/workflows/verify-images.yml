name: Verify TEE Image Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test image verification scripts
        run: |
          bash ./deploy/verify_test.sh
          python3 ./deploy/snp-image/base-history_test.py

      - name: Verify CS images, signed SNP bases, and app bundles
        run: ./deploy/verify.sh
